# --- GRID SEARCH CONFIGURATION FILE ---

hyperparameters:
  - name: zone_1_gas_to_dust
    type: categorical
    choices: [50.0, 100.0, 200.0]
    default_value: 100.0
    meta: null

  - name: zone_1_dust_mass
    type: categorical
    choices: [1.0e-3, 2.0e-3]
    default_value: 2.0e-3
    meta: null

  - name: zone_1_Rc
    type: ordinal
    sequence: [7.0, 8.0, 9.0]
    meta: null


#Fixed parameters


conditions: []
forbiddens: []

